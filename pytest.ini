[pytest]
testpaths = tests
addopts = -m "not heavy"
markers =
    unit: быстрые изолированные тесты бизнес-логики (без GPU/сети/тяжёлых весов)
    api: быстрые HTTP-тесты FastAPI через TestClient на временной БД (ML замоканы)
    heavy: тяжёлые тесты с реальными ML-весами, VRAM и нагрузкой (ручной запуск)
filterwarnings =
    ignore::DeprecationWarning
